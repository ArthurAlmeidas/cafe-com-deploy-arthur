services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe
    ports: ["5432:5432"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://cafe:cafe@db:5432/cafe
    ports: ["8000:8000"]
    depends_on: [db]

# Teste local:
#   docker compose up --build
#   curl http://localhost:8000/health
