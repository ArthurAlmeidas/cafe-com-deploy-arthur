# rodar manualmente em Actions > rollback
name: rollback
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SHA curto (7 caracteres) da última imagem estável"
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Reimplantar imagem estável
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          TAG: ${{ inputs.tag }}
        run: |
          date +%s > /tmp/inicio
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          curl -fsS -G "$HOOK" --data-urlencode "imgURL=$IMAGE"
      - name: Confirmar versão restaurada e medir tempo de recuperação
        env:
          APP_URL: ${{ vars.APP_URL }}
          TAG: ${{ inputs.tag }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$APP_URL/version" | grep -q "$TAG"; then
              echo "Rollback concluído: versão $TAG no ar em $(( $(date +%s) - $(cat /tmp/inicio) ))s"
              exit 0
            fi
            sleep 15
          done
          echo "Rollback não confirmado"; exit 1
